[alive]
header = ["The **Alive Viewer** shows which grid tiles hold live cells."]
items = [
    "{make_badge('Black', '#000000')} grid tiles are **dead cells**.",
    "{make_badge('White', '#FFFFFF')} grid tiles are **live cells**."
]
[kin-group-id]
header = ["The **Kin Group ID Viewer** shows the arrangement of hereditarily-defined cell groups."]
items = [
    "{make_badge('Black', '#000000')} grid tiles are **dead cells**.",
    "**Color saturation** (e.g., {make_badge('light green', '#BFFFBF')} vs. {make_badge('intense green', '#00FF00')} ) differentiates **low-level groups**.",
    "**Color hue** (e.g., {make_badge('blue', '#0000FF')} vs. {make_badge('purple', '#FF00FF')}) differentiates **high-level groups**, which are groups of low-level groups. ",
    "{make_badge('White', '#FFFFFF')} borders divide **low-level groups** that are part of the same high-level group. ",
    "{make_badge('Black', '#000000')} borders divide **high-level groups**."
]
[kin-group-id-view]
header = ["The **Kin Group ID View Viewer** shows the group ID that each cell's virtual cores can read from their own cell."]
items = [
    "{make_badge('Black', '#000000')} grid tiles are **dead cells**.",
    "**Color saturation** differentiates **low-level groups**.",
    "**Color hue** differentiates **high-level groups**.",
    "{make_badge('White', '#FFFFFF')} borders divide **low-level groups** that are part of the same high-level group. ",
    "{make_badge('Black', '#000000')} borders divide **high-level groups**."
]
[neighbor-kin-group-id]
header = ["The **Neighbor Kin Group ID Viewer** shows the group ID that each cell's virtual cores can read from their neighbor."]
items = [
    "{make_badge('Black', '#000000')} grid tiles are **dead cells**.",
    "**Color saturation** differentiates **low-level groups**.",
    "**Color hue** differentiates **high-level groups**.",
    "{make_badge('White', '#FFFFFF')} borders divide **low-level groups** that are part of the same high-level group. ",
    "{make_badge('Black', '#000000')} borders divide **high-level groups**."
]
[kin-group-id-by-lev]
header = ["The **Kin Group ID by Lev Viewer** shows cell group IDs at a single group level. Subview selectors show one group level."]
items = [
    "{make_badge('Black', '#000000')} grid tiles are **dead cells**.",
    "Arbitrary colors differentiate **group IDs**.",
    "{make_badge('Black', '#000000')} borders divide cells with **different group IDs**."
]
[kin-group-age]
header = ["The **Kin Group Age Viewer** shows the age of each cell's group at a single group level. Subview selectors show one group level."]
items = [
    "{make_badge('Black', '#000000')} grid tiles are **dead cells**.",
    "{make_colorbar(['#FF8080', '#FFFF80', '#80FF80', '#80FFFF', '#8080FF', '#FF80FF', '#FF8080'], ['0', '', '', '', '', '', 'high (mod 360)'], '**Color hue** indicates group age.', (), None)}",
    "{make_badge('White', '#FFFFFF')} borders divide **low-level groups** that are part of the same high-level group. ",
    "{make_badge('Black', '#000000')} borders divide **high-level groups**."
]
[kin-match]
header = ["The **Kin Match Viewer** shows whether each neighbor belongs to the same low-level group."]
items = [
    "{make_badge('Black', '#000000')} grid tiles are **dead cells**.",
    "{make_badge('Green', '#00FF00')} indicates the neighbor is a **group member**.",
    "{make_badge('White', '#FFFFFF')} indicates the neighbor is **not** a group member.",
    "{make_badge('White', '#FFFFFF')} borders divide **low-level groups** that are part of the same high-level group. ",
    "{make_badge('Black', '#000000')} borders divide **high-level groups**."
]
[peripherality-by-lev]
header = ["The **Peripherality by Lev Viewer** shows cells at the edge of their group. Subview selectors show one group level."]
items = [
    "{make_badge('Black', '#000000')} grid tiles are **dead cells**.",
    "{make_badge('Green', '#00FF00')} cells are **peripheral**.",
    "{make_badge('White', '#FFFFFF')} cells are **interior**.",
    "{make_badge('Black', '#000000')} borders divide cells with **different group IDs**."
]
[phylogenetic-root]
header = ["The **Phylogenetic Root Viewer** represents the identity of each cell's ancestor at simulation outset."]
items = [
    "{make_badge('Black', '#000000')} grid tiles are **dead cells**.",
    "{make_badge('Red', '#FF0000')} indicates **ancestor ID one**.",
    "{make_badge('Green', '#00FF00')} indicates **ancestor ID two**.",
    "{make_badge('Blue', '#0000FF')} indicates **ancestor ID three**.",
    "{make_badge('Arbitrarily', '#FF00FF')} {make_badge('generated', '#BFBFFF')} {make_badge('colors', '#BFBFFF')} represent other ancestor IDs.",
    "{make_badge('White', '#FFFFFF')} borders divide **low-level groups** that are part of the same high-level group. ",
    "{make_badge('Black', '#000000')} borders divide **high-level groups**."
]
[taxa]
header = ["The **Taxa Viewer** depicts the distribution of groups of genetically-identical cells."]
items = [
